<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>雷达发射独立版 · 本地界面验证</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#263241;background:#f3f5f7;font:15px/1.6 system-ui,'Microsoft YaHei',sans-serif}header{background:#243b61;color:white;padding:15px 28px}main{max-width:1040px;margin:30px auto;padding:0 20px}h2{font-size:25px;margin:0 0 10px}h3{font-size:18px;margin:0 0 12px}.cbi-section{background:white;border:1px solid #dce2e9;border-radius:7px;padding:24px;margin:22px 0}.cbi-value{display:flex;align-items:center;margin:15px 0;gap:20px}.cbi-value-title{width:170px;flex-shrink:0}.cbi-value-field{flex:1;min-width:0}input{border:1px solid #b9c3cf;border-radius:4px;padding:9px 10px;font:inherit;max-width:100%}button{font:inherit;padding:8px 17px;border:1px solid #aab7c9;border-radius:4px;background:#f8fafc;color:#243b61;cursor:pointer}.important{background:#2563b5;color:white;border-color:#2563b5}.description{font-size:13px;color:#627185}button:disabled,input:disabled{opacity:.6;cursor:default}@media(max-width:600px){main{margin:20px auto;padding:0 12px}.cbi-section{padding:16px}.cbi-value{display:block}.cbi-value-title{display:block;width:auto;margin-bottom:6px}.cbi-value-field{width:100%}h2{font-size:22px}header{padding:12px 16px}}
</style>
<header>RadarSender 0.1.7　/　本地界面验证（模拟状态，无真实凭据）</header><main id="root"></main>
<script>
function E(tag, attrs={}, children=[]) {
 const e=document.createElement(tag);
 for(const [key,value] of Object.entries(attrs)){if(typeof value==='function')e.addEventListener(key,value);else e.setAttribute(key,value)}
 for(const child of Array.isArray(children)?children:[children]){if(child!=null)e.append(child)}return e;
}
const params=new URLSearchParams(location.search);
const readonly=params.has('readonly');
let savedChannel='https://192.0.2.10:18880#synthetic-preview-only';
let data={ok:true,version:'0.1.7',state:params.get('state')||'idle',has_channel:true,config:{},packets:0,bytes:0,dropped:0,errors:0};
if(data.state==='waiting_channel') Object.assign(data,{capturing:true,interface:'br-lan',captured:512,offline_dropped:512,dropped:512,error:'连接通道无效、已到期或已被更新，请重新复制'});
if(data.state==='sending') Object.assign(data,{capturing:true,interface:'br-lan',captured:512,packets:512,bytes:768000});
window.fixtureCalls=[];
const rpc={declare(spec){return async(...args)=>{
 window.fixtureCalls.push({method:spec.method,args});
 if(spec.method==='status')return {...data};
 if(spec.method==='channel'){if(readonly)throw new Error('readonly fixture must not request channel');return{ok:true,channel:savedChannel}}
 if(readonly)return{ok:false,error:'没有管理权限'};
 if(spec.method==='configure'){
  if(params.has('savefail'))return{ok:false,error:'模拟保存失败，请重试'};
  if(args[0])savedChannel=args[0];data.has_channel=!!savedChannel;
  if(data.state==='waiting_channel'){data.state='sending';data.error='';data.packets=5;data.bytes=7500}
 }
 if(spec.method==='start'){data.state=params.has('offline')?'reconnecting':'sending';data.capturing=true;data.interface='br-lan';data.captured=512;data.offline_dropped=data.state==='reconnecting'?512:0;data.dropped=data.offline_dropped;data.retry_seconds=data.state==='reconnecting'?2:0};if(spec.method==='stop'){data.state='idle';data.capturing=false;data.retry_seconds=0;data.error=''};return {ok:true};
}}};
fetch('../openwrt/root/www/luci-static/resources/view/radarsender/main_v0_1_2.js').then(r=>r.text()).then(async source=>{
 const app=new Function('view','rpc','poll','E','L',source)({extend:x=>x},rpc,{add(fn){setInterval(fn,2000)}},E,{hasViewPermission:()=>!readonly});
 window.fixtureApp=app;
 document.getElementById('root').append(app.render(await app.load()));
});
</script></html>
